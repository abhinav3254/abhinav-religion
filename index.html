<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Website Removed</title>
<style>
  :root { --bg: #0b0d14; --fg: #e7e9f0; --mute: #9aa3b8; --line: #232838; --accent: #fb7185; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow-x: clip; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 120%, #1d2140 0%, var(--bg) 60%);
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--accent); animation: fade 1s ease both;
  }
  .icon svg { width: 28px; height: 28px; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1.1; animation: rise .9s .1s ease both;
  }
  .rule { width: 40px; height: 1px; background: var(--accent); margin: 24px auto; animation: fade 1s .3s ease both; }
  p { color: var(--mute); font-weight: 300; line-height: 1.6; font-size: 1rem; animation: rise .9s .35s ease both; }
  .by { margin-top: 28px; font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; animation: fade 1s .6s ease both; }
  .by b { color: var(--fg); font-weight: 500; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 8.5 4.5 9.5 7a13.6 13.6 0 0 1-2.6 3.9"/><path d="M6.6 6.6C4.5 8 3 10.200 2.500 12c1 2.500 4.500 7 9.500 7a9.700 9.700 0 0 0 4.100-.9"/><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/>
    </svg>
  </div>
  <h1>Website Removed</h1>
  <div class="rule"></div>
  <p>This page is no longer available.</p>
  <p class="by">Removed by <b>Abhinav</b></p>
</main>
</body>
</html>
